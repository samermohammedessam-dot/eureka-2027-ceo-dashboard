<script>
/**
 * Core: state, server-call wrapper, formatting helpers, nav, generic table/chart/modal builders.
 * Views (dashboard, tasks, CRM, etc.) live in JS_Views.html; CRUD forms live in JS_Forms.html.
 * Both attach to the same global `App` object defined here.
 */
var App = {
  state: { lookups: null, charts: {}, currentView: 'dashboard' },

  NAV: [
    { id: 'dashboard', label: 'Dashboard', icon: '◆' },
    { id: 'weekly', label: 'Weekly Execution', icon: '▤' },
    { id: 'tasks', label: 'Tasks', icon: '☑' },
    { id: 'crm', label: 'Sales CRM', icon: '⬢' },
    { id: 'revenue', label: 'Revenue', icon: '$' },
    { id: 'expenses', label: 'Expenses', icon: '−' },
    { id: 'markets', label: 'Markets', icon: '⌖' },
    { id: 'campaigns', label: 'Campaigns', icon: '▲' },
    { id: 'events', label: 'Events', icon: '◷' },
    { id: 'projects', label: 'Projects', icon: '▦' },
    { id: 'academy', label: 'Academy', icon: '◈' },
    { id: 'partnerships', label: 'Partnerships', icon: '⚭' },
    { id: 'kpis', label: 'KPIs', icon: '▣' },
    { id: 'monthlyReview', label: 'Monthly Review', icon: '▥' },
    { id: 'ceoReview', label: 'CEO Weekly Review', icon: '★' },
    { id: 'settings', label: 'Settings', icon: '⚙' }
  ],

  init: function () {
    this.renderNav();
    var self = this;
    this.call('api_getLookups').then(function (res) {
      self.state.lookups = res.ok ? res.data : {};
      self.navigate('dashboard');
    });
  },

  renderNav: function () {
    var html = this.NAV.map(function (n) {
      return '<div class="item" data-nav="' + n.id + '"><span class="icon">' + n.icon + '</span><span class="label-text">' + n.label + '</span></div>';
    }).join('');
    var el = document.getElementById('nav-list');
    el.innerHTML = html;
    el.querySelectorAll('.item').forEach(function (item) {
      item.addEventListener('click', function () { App.navigate(item.getAttribute('data-nav')); });
    });
  },

  navigate: function (viewId) {
    this.state.currentView = viewId;
    document.querySelectorAll('#nav-list .item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-nav') === viewId);
    });
    var nav = this.NAV.filter(function (n) { return n.id === viewId; })[0];
    document.getElementById('page-title').textContent = nav ? nav.label : '';
    document.getElementById('filters').innerHTML = '';
    document.getElementById('content').innerHTML = '<div class="loading">Loading…</div>';
    var renderer = this.Views[viewId];
    if (renderer) renderer(); else this.setContent('<div class="empty-state">View not found.</div>');
  },

  // ---- Server call wrapper: promisifies google.script.run and unwraps the {ok,data} envelope. ----
  call: function (fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      if (typeof google === 'undefined' || !google.script) {
        resolve({ ok: false, error: 'Not running inside Apps Script (google.script.run unavailable).' });
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) { resolve(res); })
        .withFailureHandler(function (err) { resolve({ ok: false, error: String(err) }); });
      runner[fnName].apply(runner, args);
    });
  },

  setContent: function (html) { document.getElementById('content').innerHTML = html; },
  setFilters: function (html) { document.getElementById('filters').innerHTML = html; },

  showError: function (msg) {
    this.setContent('<div class="card"><div class="empty-state">⚠ ' + this.esc(msg) + '</div></div>');
  },

  // ---- Formatting ----
  esc: function (s) { var d = document.createElement('div'); d.textContent = (s === undefined || s === null) ? '' : String(s); return d.innerHTML; },
  fmtMoney: function (n) { n = Number(n) || 0; return 'EGP ' + Math.round(n).toLocaleString('en-US'); },
  fmtMoneyShort: function (n) {
    n = Number(n) || 0;
    if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(2) + 'M';
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(0) + 'K';
    return String(Math.round(n));
  },
  fmtPct: function (n) { return Math.round((Number(n) || 0) * 100) + '%'; },
  fmtDate: function (d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return '';
    return dt.toISOString().slice(0, 10);
  },

  badge: function (text, tone) { return '<span class="badge ' + (tone || 'grey') + '">' + this.esc(text) + '</span>'; },
  light: function (level) { return '<span class="light ' + (level || 'GREEN') + '"></span>'; },

  statusTone: function (status) {
    if (status === 'Completed' || status === 'Collected' || status === 'Won' || status === 'Paid' || status === 'Active') return 'green';
    if (status === 'Blocked' || status === 'Overdue' || status === 'Lost' || status === 'Cancelled') return 'red';
    if (status === 'Waiting' || status === 'In Progress' || status === 'Partially Paid' || status === 'Due') return 'yellow';
    return 'grey';
  },

  progressBar: function (pct, label) {
    pct = Math.max(0, Math.min(1, Number(pct) || 0));
    var tone = pct >= 0.9 ? 'green' : (pct >= 0.6 ? 'yellow' : 'red');
    return '<div class="progress-label"><span>' + (label || '') + '</span><span>' + this.fmtPct(pct) + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill ' + tone + '" style="width:' + (pct * 100) + '%"></div></div>';
  },

  // ---- Generic sortable/filterable data table ----
  table: function (columns, rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<div class="empty-state">No records yet.</div>';
    var thead = columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('');
    if (opts.actions) thead += '<th></th>';
    var body = rows.map(function (r, idx) {
      var tds = columns.map(function (c) {
        var val = c.render ? c.render(r) : App.esc(r[c.key]);
        return '<td>' + val + '</td>';
      }).join('');
      if (opts.actions) {
        tds += '<td class="row-actions">' + opts.actions(r, idx) + '</td>';
      }
      return '<tr>' + tds + '</tr>';
    }).join('');
    return '<div class="table-scroll"><table class="data-table"><thead><tr>' + thead + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  },

  // ---- Chart.js helpers ----
  destroyChart: function (id) { if (this.state.charts[id]) { this.state.charts[id].destroy(); delete this.state.charts[id]; } },
  chartColors: ['#1a2b4c', '#c9a24b', '#1a7f4e', '#b3261e', '#5b7fb5', '#8a6d00', '#7a5ea8', '#3f8f8a', '#c26a3f', '#4c6a92'],

  barLineChart: function (canvasId, labels, datasets, type) {
    this.destroyChart(canvasId);
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.state.charts[canvasId] = new Chart(ctx, {
      type: type || 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { callback: function (v) { return App.fmtMoneyShort(v); } } } }
      }
    });
  },

  pieChart: function (canvasId, labels, values) {
    this.destroyChart(canvasId);
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.state.charts[canvasId] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: this.chartColors }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 } } } } }
    });
  },

  // ---- Modal ----
  openModal: function (title, bodyHtml, onSubmit) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.id = 'modal-backdrop';
    wrap.innerHTML = '<div class="modal"><h2>' + this.esc(title) + '</h2><div id="modal-body">' + bodyHtml + '</div>' +
      '<div class="modal-actions"><button class="btn secondary" id="modal-cancel">Cancel</button><button class="btn" id="modal-save">Save</button></div></div>';
    document.body.appendChild(wrap);
    document.getElementById('modal-cancel').onclick = function () { App.closeModal(); };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) App.closeModal(); });
    document.getElementById('modal-save').onclick = function () {
      if (onSubmit) onSubmit();
    };
  },
  closeModal: function () {
    var el = document.getElementById('modal-backdrop');
    if (el) el.remove();
  },
  formValues: function (fieldKeys) {
    var out = {};
    fieldKeys.forEach(function (k) {
      var el = document.getElementById('f_' + k);
      if (!el) return;
      if (el.type === 'checkbox') out[k] = el.checked;
      else out[k] = el.value;
    });
    return out;
  },

  field: function (key, label, type, options, value, full) {
    var id = 'f_' + key;
    var v = (value === undefined || value === null) ? '' : value;
    var input;
    if (type === 'select') {
      input = '<select id="' + id + '">' + '<option value=""></option>' + options.map(function (o) {
        var ov = (typeof o === 'object') ? o.value : o;
        var ol = (typeof o === 'object') ? o.label : o;
        return '<option value="' + App.esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + App.esc(ol) + '</option>';
      }).join('') + '</select>';
    } else if (type === 'textarea') {
      input = '<textarea id="' + id + '" rows="2">' + App.esc(v) + '</textarea>';
    } else if (type === 'checkbox') {
      input = '<input type="checkbox" id="' + id + '" ' + (v === true || v === 'TRUE' ? 'checked' : '') + ' style="width:auto">';
    } else if (type === 'date') {
      input = '<input type="date" id="' + id + '" value="' + App.esc(App.fmtDate(v)) + '">';
    } else if (type === 'number') {
      input = '<input type="number" id="' + id + '" value="' + App.esc(v) + '">';
    } else {
      input = '<input type="text" id="' + id + '" value="' + App.esc(v) + '">';
    }
    return '<div class="form-field' + (full ? ' full' : '') + '"><label>' + label + '</label>' + input + '</div>';
  },

  toast: function (msg, isError) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:' + (isError ? '#b3261e' : '#1a7f4e') + ';color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  },

  Views: {} // populated by JS_Views.html
};
</script>

<script>
/** All top-level views. Each function fetches data via App.call() then paints App.setContent(). */

App.Views.dashboard = function () {
  App.call('api_getDashboard').then(function (res) {
    if (!res.ok) return App.showError(res.error);
    var d = res.data;
    var h = d.headline;
    var alertsHtml = renderAlerts(d.alerts);
    var progressToTargets = ['min', 'target', 'stretch'].map(function (k) {
      var val = d.targets[k];
      var pct = val ? h.revenueActual / val : 0;
      var label = k === 'min' ? 'Minimum (10M)' : (k === 'target' ? 'Operating Target (12.7M)' : 'Stretch (15M)');
      return '<div style="margin-bottom:10px">' + App.progressBar(pct, label + ' — ' + App.fmtMoney(val)) + '</div>';
    }).join('');

    App.setContent(
      '<div class="kpi-grid">' +
        kpiTile('Revenue Actual', App.fmtMoney(h.revenueActual), App.fmtPct(h.revenueAchievementPct) + ' of ' + App.fmtMoney(h.revenueTarget)) +
        kpiTile('Sales Bookings', App.fmtMoney(h.bookingsActual), 'Target ' + App.fmtMoney(h.bookingsTarget)) +
        kpiTile('Cash Collected', App.fmtMoney(h.cashCollected), 'Outstanding ' + App.fmtMoney(h.outstandingReceivables)) +
        kpiTile('Growth Spend', App.fmtMoney(h.actualGrowthSpend), 'Budget ' + App.fmtMoney(h.growthBudget) + ' · Var ' + App.fmtMoney(h.budgetVariance)) +
        kpiTile('Total Pipeline', App.fmtMoney(h.totalPipeline), 'Weighted ' + App.fmtMoney(h.weightedPipeline)) +
        kpiTile('Pipeline Coverage', h.pipelineCoverage.toFixed(1) + 'x', 'Target ~3.0x, floor 2.5x') +
        kpiTile('Win Rate', App.fmtPct(h.winRate), h.dealsWon + ' deals won') +
        kpiTile('Tasks Completion', App.fmtPct(h.tasksCompletionPct), 'All active weeks') +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="card"><h3>Path to 2027 Revenue Scenarios</h3>' + progressToTargets + '</div>' +
        '<div class="card"><h3>Alerts</h3>' + alertsHtml + '</div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="card"><h3>Revenue: Target vs Actual by Month</h3><div style="height:260px"><canvas id="chartRevMonth"></canvas></div></div>' +
        '<div class="card"><h3>Bookings: Target vs Actual by Month</h3><div style="height:260px"><canvas id="chartBookMonth"></canvas></div></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="card"><h3>Revenue by Market (Target vs Actual)</h3><div style="height:260px"><canvas id="chartRevMarket"></canvas></div></div>' +
        '<div class="card"><h3>Revenue by Business Unit</h3><div style="height:260px"><canvas id="chartRevBU"></canvas></div></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="card"><h3>Pipeline by Sales Stage</h3><div style="height:260px"><canvas id="chartPipeStage"></canvas></div></div>' +
        '<div class="card"><h3>Budget vs Actual Spend by Month</h3><div style="height:260px"><canvas id="chartBudget"></canvas></div></div>' +
      '</div>'
    );

    var c = d.charts;
    App.barLineChart('chartRevMonth', c.revenueByMonth.map(function (m) { return m.month.slice(0, 3); }), [
      { label: 'Target', data: c.revenueByMonth.map(function (m) { return m.revenueTarget; }), backgroundColor: '#cfd8e8' },
      { label: 'Actual', data: c.revenueByMonth.map(function (m) { return m.revenueActual; }), backgroundColor: '#1a2b4c' }
    ]);
    App.barLineChart('chartBookMonth', c.revenueByMonth.map(function (m) { return m.month.slice(0, 3); }), [
      { label: 'Target', data: c.revenueByMonth.map(function (m) { return m.bookingsTarget; }), backgroundColor: '#eadfc0' },
      { label: 'Actual', data: c.revenueByMonth.map(function (m) { return m.bookingsActual; }), backgroundColor: '#c9a24b' }
    ]);
    App.barLineChart('chartRevMarket', c.revenueByMarket.map(function (m) { return m.market; }), [
      { label: 'Target', data: c.revenueByMarket.map(function (m) { return m.target; }), backgroundColor: '#cfd8e8' },
      { label: 'Actual', data: c.revenueByMarket.map(function (m) { return m.actual; }), backgroundColor: '#1a7f4e' }
    ]);
    App.pieChart('chartRevBU', c.revenueByBusinessUnit.map(function (m) { return m.businessUnit; }), c.revenueByBusinessUnit.map(function (m) { return m.actual; }));
    App.pieChart('chartPipeStage', c.pipelineByStage.map(function (m) { return m.stage; }), c.pipelineByStage.map(function (m) { return m.value; }));
    App.barLineChart('chartBudget', c.revenueByMonth.map(function (m) { return m.month.slice(0, 3); }), [
      { label: 'Budget', data: c.revenueByMonth.map(function (m) { return m.budget; }), backgroundColor: '#eadfc0' },
      { label: 'Actual Spend', data: c.revenueByMonth.map(function (m) { return m.actualSpend; }), backgroundColor: '#b3261e' }
    ]);
  });
};

function kpiTile(label, value, sub) {
  return '<div class="kpi-card"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div>';
}

function renderAlerts(alerts) {
  if (!alerts || !alerts.length) return '<div class="empty-state">No active alerts. All metrics within threshold.</div>';
  return alerts.slice(0, 12).map(function (a) {
    return '<div class="alert-item"><span class="dot">' + App.light(a.level) + '</span><div><span class="area">' + App.esc(a.area) + ':</span>' + App.esc(a.message) + '</div></div>';
  }).join('');
}

// ---------------------------------------------------------------- Weekly Execution
App.Views.weekly = function () {
  App.call('api_getLookups').then(function (lk) {
    var weeks = lk.ok ? lk.data.weeks : [];
    App.setFilters('<select id="weekPicker">' + weeks.map(function (w) { return '<option value="' + w.weekId + '">' + w.label + '</option>'; }).join('') + '</select>');
    var current = weeks[0] ? weeks[0].weekId : null;
    document.getElementById('weekPicker').onchange = function (e) { loadWeek(e.target.value); };
    loadWeek(null);
  });

  function loadWeek(weekId) {
    App.call('api_getWeeklyReview', weekId).then(function (res) {
      if (!res.ok || !res.data) return App.showError(res.error || 'No week data.');
      var w = res.data.week;
      document.getElementById('weekPicker') && (document.getElementById('weekPicker').value = w.weekId);
      App.call('api_getTasks', { weekId: w.weekId }).then(function (tres) {
        var tasks = tres.ok ? tres.data : [];
        App.setContent(
          '<div class="card"><h3>' + w.weekId + ' — ' + App.fmtDate(w.startDate) + ' to ' + App.fmtDate(w.endDate) + ' (' + w.month + ', ' + w.quarter + ')</h3>' +
          '<div class="grid-3">' +
            infoBlock('Strategic Theme', w.strategicTheme) +
            infoBlock('Campaign', w.campaign) +
            infoBlock('Primary / Secondary Market', w.primaryMarket + (w.secondaryMarket ? ' / ' + w.secondaryMarket : '')) +
          '</div>' +
          '<div class="grid-3" style="margin-top:12px">' +
            infoBlock('Sales Target (Week)', App.fmtMoney(w.salesTargetWeek)) +
            infoBlock('Revenue Target (Week)', App.fmtMoney(w.revenueTargetWeek)) +
            infoBlock('Budget Planned (Week)', App.fmtMoney(w.budgetPlannedWeek)) +
          '</div></div>' +
          '<div class="card"><div class="toolbar"><h3 style="margin:0">Tasks this week</h3><button class="btn small" id="btnAddWeekTask">+ Add Task</button></div>' +
          taskTable(tasks) + '</div>'
        );
        document.getElementById('btnAddWeekTask').onclick = function () { App.Forms.openTaskForm(null, w.weekId); };
        wireTaskRowActions();
      });
    });
  }
};

function infoBlock(label, value) {
  return '<div><div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px">' + label + '</div><div style="font-size:13.5px;font-weight:600">' + App.esc(value || '—') + '</div></div>';
}

// ---------------------------------------------------------------- Tasks
App.Views.tasks = function () {
  var filters = {};
  App.setFilters(
    '<select id="fltStatus"><option value="">All Status</option></select>' +
    '<select id="fltPriority"><option value="">All Priority</option></select>' +
    '<input class="search" id="fltSearch" placeholder="Search tasks…">' +
    '<button class="btn small" id="btnAddTask">+ Add Task</button>'
  );
  fillOptions('fltStatus', App.state.lookups.taskStatus);
  fillOptions('fltPriority', App.state.lookups.taskPriority);
  document.getElementById('btnAddTask').onclick = function () { App.Forms.openTaskForm(null, null); };
  ['fltStatus', 'fltPriority'].forEach(function (id) {
    document.getElementById(id).onchange = function () { load(); };
  });
  document.getElementById('fltSearch').oninput = debounce(function () { load(); }, 300);

  function load() {
    filters.status = document.getElementById('fltStatus').value;
    filters.priority = document.getElementById('fltPriority').value;
    filters._search = document.getElementById('fltSearch').value;
    App.call('api_getTasks', filters).then(function (res) {
      if (!res.ok) return App.showError(res.error);
      App.setContent('<div class="card">' + taskTable(res.data) + '</div>');
      wireTaskRowActions();
    });
  }
  load();
};

function taskTable(tasks) {
  return App.table([
    { key: 'trafficLight', label: '', render: function (r) { return App.light(r.trafficLight || 'GREEN'); } },
    { key: 'weekId', label: 'Week' },
    { key: 'task', label: 'Task' },
    { key: 'taskCategory', label: 'Category' },
    { key: 'taskOwner', label: 'Owner' },
    { key: 'priority', label: 'Priority', render: function (r) { return App.badge(r.priority, r.priority === 'Critical' ? 'red' : (r.priority === 'High' ? 'yellow' : 'grey')); } },
    { key: 'status', label: 'Status', render: function (r) { return App.badge(r.status, App.statusTone(r.status)); } },
    { key: 'dueDate', label: 'Due', render: function (r) { return App.fmtDate(r.dueDate); } },
    { key: 'percentCompletion', label: '%', render: function (r) { return App.fmtPct(r.percentCompletion); } },
    { key: 'ceoAttentionRequired', label: 'CEO?', render: function (r) { return r.ceoAttentionRequired ? '⚑' : ''; } }
  ], tasks, {
    actions: function (r) { return '<a data-edit="' + r.taskId + '">Edit</a><a data-del="' + r.taskId + '">Delete</a>'; }
  });
}

function wireTaskRowActions() {
  document.querySelectorAll('[data-edit]').forEach(function (el) {
    el.onclick = function () {
      App.call('api_getTasks', { taskId: el.getAttribute('data-edit') }).then(function (res) {
        if (res.ok && res.data[0]) App.Forms.openTaskForm(res.data[0]);
      });
    };
  });
  document.querySelectorAll('[data-del]').forEach(function (el) {
    el.onclick = function () {
      if (!confirm('Delete this task?')) return;
      App.call('api_deleteTask', el.getAttribute('data-del')).then(function () { App.navigate('tasks'); });
    };
  });
}

// ---------------------------------------------------------------- Sales CRM (Pipeline)
App.Views.crm = function () {
  App.setFilters('<select id="fltStage"><option value="">All Stages</option></select><input class="search" id="fltSearch" placeholder="Search opportunities…"><button class="btn small" id="btnAddOpp">+ Add Opportunity</button>');
  fillOptions('fltStage', App.state.lookups.salesStages.map(function (s) { return s.name; }));
  document.getElementById('btnAddOpp').onclick = function () { App.Forms.openPipelineForm(null); };
  document.getElementById('fltStage').onchange = load;
  document.getElementById('fltSearch').oninput = debounce(load, 300);

  function load() {
    var filters = { stage: document.getElementById('fltStage').value, _search: document.getElementById('fltSearch').value };
    Promise.all([App.call('api_getPipeline', filters), App.call('api_getPipelineSummary')]).then(function (results) {
      var oppRes = results[0], sumRes = results[1];
      if (!oppRes.ok) return App.showError(oppRes.error);
      var s = sumRes.ok ? sumRes.data : {};
      App.setContent(
        '<div class="kpi-grid">' +
          kpiTile('Total Pipeline', App.fmtMoney(s.totalPipeline), 'Coverage ' + (s.coverage || 0).toFixed(1) + 'x (target ~3.0x)') +
          kpiTile('Weighted Pipeline', App.fmtMoney(s.weightedPipeline), '') +
          kpiTile('Win Rate', App.fmtPct(s.winRate), (s.wonCount || 0) + ' won / ' + (s.lostCount || 0) + ' lost') +
          kpiTile('Avg Deal Size', App.fmtMoney(s.avgDealSize), s.avgSalesCycleDays ? s.avgSalesCycleDays + ' day avg cycle' : '') +
        '</div>' +
        '<div class="card">' + App.table([
          { key: 'organization', label: 'Organization' },
          { key: 'market', label: 'Market' },
          { key: 'bdOwner', label: 'BD Owner' },
          { key: 'businessUnit', label: 'Business Unit' },

App.Views.monthlyReview = function () {
  var months = App.state.lookups.months;

  document.getElementById('monthPicker').onchange = function (e) { load(e.target.value); };
  load(currentMonth);

  function load(month) {
    App.call('api_getMonthlyReview', month).then(function (res) {
      if (!res.ok || !res.data) return App.showError((res.error) || 'No plan data for ' + month);
      var m = res.data;
      App.setContent(
        '<div class="card"><h3>Automated CEO Summary — ' + month + '</h3><div class="summary-box">' + App.esc(m.generatedSummary) + '</div></div>' +
        '<div class="grid-2">' +
          '<div class="card"><h3>Target vs Actual</h3>' +
            App.progressBar(m.revenueTarget ? m.revenueActual / m.revenueTarget : 0, 'Revenue — ' + App.fmtMoney(m.revenueActual) + ' / ' + App.fmtMoney(m.revenueTarget)) +
            '<div style="height:8px"></div>' +
            App.progressBar(m.bookingsTarget ? m.bookingsActual / m.bookingsTarget : 0, 'Bookings — ' + App.fmtMoney(m.bookingsActual) + ' / ' + App.fmtMoney(m.bookingsTarget)) +
            '<div style="height:8px"></div>' +
            App.progressBar(m.budget ? m.spend / m.budget : 0, 'Budget Utilization — ' + App.fmtMoney(m.spend) + ' / ' + App.fmtMoney(m.budget)) +
          '</div>' +
          '<div class="card"><h3>Market & Service Performance</h3>' +
            infoBlock('Best Performing Market', m.bestMarket) + '<div style="height:10px"></div>' +
            infoBlock('Weakest Market', m.worstMarket) + '<div style="height:10px"></div>' +
            infoBlock('Top Revenue Service', m.topService) + '<div style="height:10px"></div>' +
            infoBlock('Top Pipeline-Generating Campaign', m.topCampaign) + '<div style="height:10px"></div>' +

  }

  function loadTab() {
    var body = document.getElementById('settings-body');
    if (active === 'general') {
      App.call('api_getSettings').then(function (res) {
        var rows = Object.keys(res.data || {}).map(function (k) { return { setting: k, value: res.data[k] }; });

    var map = {
      team: [SHEETS_JS.TEAM, 'teamId', [{ key: 'name', label: 'Name' }, { key: 'role', label: 'Role' }, { key: 'responsibilities', label: 'Responsibilities' }, { key: 'marketsOwned', label: 'Markets Owned' }, { key: 'active', label: 'Active', render: function (r) { return r.active ? '✔' : ''; } }], 'Team Member'],
      markets: [SHEETS_JS.MARKETS, 'marketId', [{ key: 'market', label: 'Market' }, { key: 'country', label: 'Country' }, { key: 'revenueTarget2027', label: 'Revenue Target', render: function (r) { return App.fmtMoney(r.revenueTarget2027); } }, { key: 'owner', label: 'Owner' }, { key: 'status', label: 'Status' }], 'Market'],

      digitalRoadmap: [SHEETS_JS.DIGITAL_ROADMAP, 'featureId', [{ key: 'feature', label: 'Feature' }, { key: 'phase', label: 'Phase' }, { key: 'owner', label: 'Owner' }, { key: 'deadline', label: 'Deadline', render: function (r) { return App.fmtDate(r.deadline); } }, { key: 'status', label: 'Status', render: function (r) { return App.badge(r.status, App.statusTone(r.status)); } }], 'Digital Roadmap Item'],
      decisions: [SHEETS_JS.DECISIONS, 'decisionId', [{ key: 'date', label: 'Date', render: function (r) { return App.fmtDate(r.date); } }, { key: 'issue', label: 'Issue' }, { key: 'decision', label: 'Decision' }, { key: 'decisionOwner', label: 'Owner' }, { key: 'status', label: 'Status', render: function (r) { return App.badge(r.status, App.statusTone(r.status)); } }], 'Decision'],
      risks: [SHEETS_JS.RISKS, 'riskId', [{ key: 'risk', label: 'Risk' }, { key: 'category', label: 'Category' }, { key: 'riskScore', label: 'Score' }, { key: 'owner', label: 'Owner' }, { key: 'status', label: 'Status', render: function (r) { return App.badge(r.status, App.statusTone(r.status)); } }], 'Risk']
    };
    var cfg = map[active];
    if (!cfg) { body.innerHTML = ''; return; }
    var sheetName = cfg[0], idKey = cfg[1], columns = cfg[2], label = cfg[3];

      });

        el.onclick = function () { if (confirm('Delete this record?')) App.call('api_deleteGenericRecord', sheetName, el.getAttribute('data-del-s')).then(loadTab); };

function fillOptions(id, list) {
  var el = document.getElementById(id);
  if (!el) return;
  (list || []).forEach(function (v) { var o = document.createElement('option'); o.value = v; o.textContent = v; el.appendChild(o); });

function debounce(fn, ms) { var t; return function () { clearTimeout(t); var a = arguments; t = setTimeout(function () { fn.apply(null, a); }, ms); }; }

<script>
/** CRUD modal forms. Each opens a modal built from a field-definition list, then posts to the matching api_save* function. */
App.Forms = {};

function buildForm(fields, record) {
  record = record || {};
  return '<div class="form-grid">' + fields.map(function (f) {
    return App.field(f.key, f.label, f.type, f.options, record[f.key], f.full);
  }).join('') + '</div>';
}

function collect(fields) {
  var out = {};
  fields.forEach(function (f) {
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    if (f.type === 'checkbox') out[f.key] = el.checked;
    else if (f.type === 'percentInput') out[f.key] = (Number(el.value) || 0) / 100;
    else if (f.type === 'number') out[f.key] = Number(el.value) || 0;
    else out[f.key] = el.value;
  });
  return out;
}

function lk(key) { return (App.state.lookups && App.state.lookups[key]) || []; }

App.Forms.openGenericForm = function (sheetName, idKey, record, label, onSaved) {
  var fields = buildGenericFieldDefs()[sheetName];
  if (!fields) { App.toast('No form defined for ' + sheetName, true); return; }
  App.openModal((record ? 'Edit ' : 'Add ') + label, buildForm(fields, record), function () {
    var data = collect(fields);
    if (record) data[idKey] = record[idKey];
    App.call('api_saveGenericRecord', sheetName, data).then(function (res) {
      App.closeModal();
      if (res.ok) { App.toast(label + ' saved.'); if (onSaved) onSaved(); else App.navigate(App.state.currentView); }
      else App.toast(res.error, true);
    });
  });
};
