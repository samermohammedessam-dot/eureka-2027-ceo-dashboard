<style>
  :root {
    --navy: #1a2b4c;
    --navy-light: #24365c;
    --gold: #c9a24b;
    --green: #1a7f4e;
    --green-bg: #e6f4ec;
    --red: #b3261e;
    --red-bg: #fbe9e7;
    --yellow: #8a6d00;
    --yellow-bg: #fff6da;
    --bg: #f4f6fa;
    --card-bg: #ffffff;
    --text: #1c1f26;
    --text-muted: #6b7280;
    --border: #e3e6ec;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 14px; }
  a { color: inherit; }
  #app { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  #sidebar { width: 236px; background: var(--navy); color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  #sidebar .brand { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  #sidebar .brand .name { font-weight: 700; font-size: 15px; letter-spacing: .3px; }
  #sidebar .brand .tag { font-size: 11px; color: var(--gold); margin-top: 2px; }
  #sidebar nav { padding: 10px 0; flex: 1; }
  #sidebar nav .item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; cursor: pointer; color: rgba(255,255,255,0.78); font-size: 13.5px; border-left: 3px solid transparent; }
  #sidebar nav .item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  #sidebar nav .item.active { background: rgba(255,255,255,0.10); color: #fff; border-left-color: var(--gold); font-weight: 600; }
  #sidebar nav .icon { width: 18px; text-align: center; }
  #sidebar .foot { padding: 12px 18px; font-size: 11px; color: rgba(255,255,255,0.45); border-top: 1px solid rgba(255,255,255,0.12); }

  /* ---- Main ---- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 5; }
  #topbar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  #topbar .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  #filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #filters select, #filters input { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; background: #fff; }
  #content { padding: 22px 24px 60px; flex: 1; }

  /* ---- Cards / KPI tiles ---- */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi-card .label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
  .kpi-card .value { font-size: 21px; font-weight: 700; }
  .kpi-card .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .kpi-card .delta-pos { color: var(--green); }
  .kpi-card .delta-neg { color: var(--red); }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 14.5px; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 980px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } #sidebar { width: 64px; } #sidebar .label-text, #sidebar .brand .tag, #sidebar .brand .name { display: none; } }

  canvas { max-width: 100%; }

  /* ---- Progress ---- */
  .progress-track { background: #edf0f5; border-radius: 20px; height: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 20px; background: var(--navy); }
  .progress-fill.green { background: var(--green); }
  .progress-fill.yellow { background: #c9a227; }
  .progress-fill.red { background: var(--red); }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--text-muted); }

  /* ---- Badges / traffic lights ---- */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.green, .light.GREEN { background: var(--green-bg); color: var(--green); }
  .badge.red, .light.RED { background: var(--red-bg); color: var(--red); }
  .badge.yellow, .light.YELLOW { background: var(--yellow-bg); color: var(--yellow); }
  .badge.grey { background: #eef0f4; color: var(--text-muted); }
  .light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .light.GREEN { background: var(--green); }
  .light.RED { background: var(--red); }
  .light.YELLOW { background: #c9a227; }

  /* ---- Tables ---- */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--text-muted); border-bottom: 2px solid var(--border); padding: 8px 10px; white-space: nowrap; position: sticky; top: 0; background: var(--card-bg); }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.data-table tr:hover td { background: #fafbfd; }
  .table-scroll { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
  .row-actions a { cursor: pointer; color: var(--navy); font-size: 12px; margin-right: 10px; text-decoration: underline; }

  /* ---- Buttons ---- */
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--navy); color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--navy-light); }
  .btn.secondary { background: #fff; color: var(--navy); border: 1px solid var(--border); }
  .btn.danger { background: var(--red); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .toolbar .search { border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 13px; min-width: 220px; }

  /* ---- Modal ---- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,24,34,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { margin: 0 0 16px; font-size: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-field label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  .alert-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .alert-item:last-child { border-bottom: none; }
  .alert-item .dot { flex-shrink: 0; margin-top: 4px; }
  .alert-item .area { font-weight: 600; margin-right: 4px; }
  .empty-state { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .loading { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .heat-cell { border-radius: 8px; padding: 12px; color: #fff; }
  .heat-cell .m-name { font-weight: 700; font-size: 13px; }
  .heat-cell .m-pct { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .heat-cell .m-sub { font-size: 11px; opacity: .9; margin-top: 4px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tabs .tab { padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .tabs .tab.active { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  .summary-box { background: #f7f4ea; border: 1px solid #e9dfc0; border-radius: 8px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; }
</style>
