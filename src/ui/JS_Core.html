<script>
/**
 * Core: state, server-call wrapper, formatting helpers, nav, generic table/chart/modal builders.
 * Views (dashboard, tasks, CRM, etc.) live in JS_Views.html; CRUD forms live in JS_Forms.html.
 * Both attach to the same global `App` object defined here.
 */
var App = {
  state: { lookups: null, charts: {}, currentView: 'dashboard', cache: {}, pending: {} },
  CACHE_TTL_MS: 60000, // Performance Sprint: a view fetched again within this window is served from memory, not the server

  // ---- Performance instrumentation: performance.now() markers, logged to the console.
  // Not surfaced in the UI — open devtools to see them. Safe to leave in permanently. ----
  perf: { marks: {} },
  mark: function (name) {
    var t = (window.performance && performance.now) ? performance.now() : Date.now();
    this.perf.marks[name] = t;
    console.log('[perf] ' + name + ': ' + t.toFixed(0) + 'ms since navigation start');
    return t;
  },

  NAV: [
    { id: 'dashboard', label: 'Dashboard', icon: '◆' },
    { id: 'weekly', label: 'Weekly Execution', icon: '▤' },
    { id: 'tasks', label: 'Tasks', icon: '☑' },
    { id: 'crm', label: 'Sales CRM', icon: '⬢' },
    { id: 'revenue', label: 'Revenue', icon: '$' },
    { id: 'expenses', label: 'Expenses', icon: '−' },
    { id: 'markets', label: 'Markets', icon: '⌖' },
    { id: 'campaigns', label: 'Campaigns', icon: '▲' },
    { id: 'events', label: 'Events', icon: '◷' },
    { id: 'projects', label: 'Projects', icon: '▦' },
    { id: 'academy', label: 'Academy', icon: '◈' },
    { id: 'partnerships', label: 'Partnerships', icon: '⚭' },
    { id: 'kpis', label: 'KPIs', icon: '▣' },
    { id: 'monthlyReview', label: 'Monthly Review', icon: '▥' },
    { id: 'ceoReview', label: 'CEO Weekly Review', icon: '★' },
    { id: 'settings', label: 'Settings', icon: '⚙' }
  ],

  init: function () {
    if (this._initStarted) return; // guard against a stray duplicate init call re-fetching everything
    this._initStarted = true;
    this.mark('shellDisplayed'); // sidebar/topbar/CSS are already painted by the time this JS runs — see Index.html
    this.renderNav();
    var self = this;
    this.call('api_getLookups').then(function (res) {
      self.state.lookups = res.ok ? res.data : {};
      self.mark('lookupsReceived');
      self.navigate('dashboard');
    });
  },

  renderNav: function () {
    var html = this.NAV.map(function (n) {
      return '<div class="item" data-nav="' + n.id + '"><span class="icon">' + n.icon + '</span><span class="label-text">' + n.label + '</span></div>';
    }).join('');
    var el = document.getElementById('nav-list');
    el.innerHTML = html;
    el.querySelectorAll('.item').forEach(function (item) {
      item.addEventListener('click', function () { App.navigate(item.getAttribute('data-nav')); });
    });
  },

  // Skeleton placeholders shown the instant a nav item is clicked, before any server response
  // arrives — keeps the interface feeling responsive even on a slow connection (Section 9,
  // "progressive visual loading": Phase 1 shell is already on screen, this is Phase 2's
  // placeholder ahead of the real KPI cards/table landing in the same slot).
  SKELETON: '<div class="kpi-grid">' +
    '<div class="kpi-card"><div class="label">&nbsp;</div><div class="value">···</div></div>'.repeat(4) +
    '</div><div class="card"><div class="loading">Loading…</div></div>',

  // Re-navigating to the same view (e.g. after a CRUD save calls App.navigate(currentView)
  // to refresh it) is intentionally NOT short-circuited here — the render function itself is
  // cheap, and the actual expensive part (the server round trip inside App.call) is already
  // deduped/cached there, with writes clearing that cache so a post-save refresh always
  // fetches the new data instead of quietly reusing something stale.
  navigate: function (viewId) {
    this.state.currentView = viewId;
    document.querySelectorAll('#nav-list .item').forEach(function (i) {
      i.classList.toggle('active', i.getAttribute('data-nav') === viewId);
    });
    var nav = this.NAV.filter(function (n) { return n.id === viewId; })[0];
    document.getElementById('page-title').textContent = nav ? nav.label : '';
    document.getElementById('filters').innerHTML = '';
    document.getElementById('content').innerHTML = this.SKELETON;
    var renderer = this.Views[viewId];
    if (renderer) renderer(); else this.setContent('<div class="empty-state">View not found.</div>');
  },

  /**
   * Server call wrapper: promisifies google.script.run, unwraps the {ok,data} envelope, and
   * (Performance Sprint) adds a short in-memory cache + in-flight de-duplication for read
   * calls (functions named "api_get..."): navigating back to a view already loaded within
   * CACHE_TTL_MS resolves instantly with no network round trip, and two callers asking for
   * the exact same data at the same moment (e.g. a double click) share one request instead
   * of firing two. Any write call (a function named "api_save..." or "api_delete...") clears
   * the whole cache afterward — simplest correct invalidation policy: a write can affect more
   * than one view's aggregates (e.g. a task edit changes both the Tasks table and the
   * Dashboard's completion %), so rather than hand-maintain which cache entries a given write
   * can touch, just drop all of them and let
   * the next visit to each view re-fetch once.
   */
  call: function (fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    var isRead = fnName.indexOf('api_get') === 0;
    var isWrite = fnName.indexOf('api_save') === 0 || fnName.indexOf('api_delete') === 0;
    var key = fnName + '|' + JSON.stringify(args);
    var self = this;

    if (isRead) {
      var cached = this.state.cache[key];
      if (cached && (Date.now() - cached.ts) < this.CACHE_TTL_MS) {
        return Promise.resolve(cached.data);
      }
      if (this.state.pending[key]) return this.state.pending[key];
    }

    var promise = new Promise(function (resolve) {
      if (typeof google === 'undefined' || !google.script) {
        resolve({ ok: false, error: 'Not running inside Apps Script (google.script.run unavailable).' });
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) { resolve(res); })
        .withFailureHandler(function (err) { resolve({ ok: false, error: String(err) }); });
      runner[fnName].apply(runner, args);
    }).then(function (res) {
      if (isRead) {
        delete self.state.pending[key];
        if (res && res.ok) self.state.cache[key] = { data: res, ts: Date.now() };
      }
      if (isWrite) self.invalidateCache();
      return res;
    });

    if (isRead) this.state.pending[key] = promise;
    return promise;
  },

  invalidateCache: function () { this.state.cache = {}; this.state.pending = {}; },

  setContent: function (html) { document.getElementById('content').innerHTML = html; },
  setFilters: function (html) { document.getElementById('filters').innerHTML = html; },

  /** Prev/Next + "Showing X-Y of Z" footer for a paginated api_get* response ({records,total,page,pageSize,totalPages}). */
  paginationControls: function (pageInfo, onPageChange) {
    var id = 'pg_' + Math.random().toString(36).slice(2, 8);
    var from = pageInfo.total === 0 ? 0 : (pageInfo.page - 1) * pageInfo.pageSize + 1;
    var to = Math.min(pageInfo.page * pageInfo.pageSize, pageInfo.total);
    setTimeout(function () {
      var prevBtn = document.getElementById(id + '_prev');
      var nextBtn = document.getElementById(id + '_next');
      if (prevBtn) prevBtn.onclick = function () { onPageChange(pageInfo.page - 1); };
      if (nextBtn) nextBtn.onclick = function () { onPageChange(pageInfo.page + 1); };
    }, 0);
    return '<div class="toolbar" style="margin-top:10px">' +
      '<span style="font-size:12px;color:var(--text-muted)">Showing ' + from + '-' + to + ' of ' + pageInfo.total + '</span>' +
      '<span>' +
      '<button class="btn secondary small" id="' + id + '_prev" ' + (pageInfo.page <= 1 ? 'disabled' : '') + '>← Prev</button> ' +
      '<button class="btn secondary small" id="' + id + '_next" ' + (pageInfo.page >= pageInfo.totalPages ? 'disabled' : '') + '>Next →</button>' +
      '</span></div>';
  },

  showError: function (msg) {
    this.setContent('<div class="card"><div class="empty-state">⚠ ' + this.esc(msg) + '</div></div>');
  },

  // ---- Formatting ----
  esc: function (s) { var d = document.createElement('div'); d.textContent = (s === undefined || s === null) ? '' : String(s); return d.innerHTML; },
  fmtMoney: function (n) { n = Number(n) || 0; return 'EGP ' + Math.round(n).toLocaleString('en-US'); },
  fmtMoneyShort: function (n) {
    n = Number(n) || 0;
    if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(2) + 'M';
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(0) + 'K';
    return String(Math.round(n));
  },
  fmtPct: function (n) { return Math.round((Number(n) || 0) * 100) + '%'; },
  fmtDate: function (d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return '';
    return dt.toISOString().slice(0, 10);
  },

  badge: function (text, tone) { return '<span class="badge ' + (tone || 'grey') + '">' + this.esc(text) + '</span>'; },
  light: function (level) { return '<span class="light ' + (level || 'GREEN') + '"></span>'; },

  statusTone: function (status) {
    if (status === 'Completed' || status === 'Collected' || status === 'Won' || status === 'Paid' || status === 'Active') return 'green';
    if (status === 'Blocked' || status === 'Overdue' || status === 'Lost' || status === 'Cancelled') return 'red';
    if (status === 'Waiting' || status === 'In Progress' || status === 'Partially Paid' || status === 'Due') return 'yellow';
    return 'grey';
  },

  progressBar: function (pct, label) {
    pct = Math.max(0, Math.min(1, Number(pct) || 0));
    var tone = pct >= 0.9 ? 'green' : (pct >= 0.6 ? 'yellow' : 'red');
    return '<div class="progress-label"><span>' + (label || '') + '</span><span>' + this.fmtPct(pct) + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill ' + tone + '" style="width:' + (pct * 100) + '%"></div></div>';
  },

  // ---- Generic sortable/filterable data table ----
  table: function (columns, rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<div class="empty-state">No records yet.</div>';
    var thead = columns.map(function (c) { return '<th>' + c.label + '</th>'; }).join('');
    if (opts.actions) thead += '<th></th>';
    var body = rows.map(function (r, idx) {
      var tds = columns.map(function (c) {
        var val = c.render ? c.render(r) : App.esc(r[c.key]);
        return '<td>' + val + '</td>';
      }).join('');
      if (opts.actions) {
        tds += '<td class="row-actions">' + opts.actions(r, idx) + '</td>';
      }
      return '<tr>' + tds + '</tr>';
    }).join('');
    return '<div class="table-scroll"><table class="data-table"><thead><tr>' + thead + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  },

  // ---- Chart.js helpers ----
  destroyChart: function (id) { if (this.state.charts[id]) { this.state.charts[id].destroy(); delete this.state.charts[id]; } },
  chartColors: ['#1a2b4c', '#c9a24b', '#1a7f4e', '#b3261e', '#5b7fb5', '#8a6d00', '#7a5ea8', '#3f8f8a', '#c26a3f', '#4c6a92'],

  barLineChart: function (canvasId, labels, datasets, type) {
    this.destroyChart(canvasId);
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.state.charts[canvasId] = new Chart(ctx, {
      type: type || 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { callback: function (v) { return App.fmtMoneyShort(v); } } } }
      }
    });
  },

  pieChart: function (canvasId, labels, values) {
    this.destroyChart(canvasId);
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    this.state.charts[canvasId] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: this.chartColors }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 } } } } }
    });
  },

  // ---- Modal ----
  openModal: function (title, bodyHtml, onSubmit) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.id = 'modal-backdrop';
    wrap.innerHTML = '<div class="modal"><h2>' + this.esc(title) + '</h2><div id="modal-body">' + bodyHtml + '</div>' +
      '<div class="modal-actions"><button class="btn secondary" id="modal-cancel">Cancel</button><button class="btn" id="modal-save">Save</button></div></div>';
    document.body.appendChild(wrap);
    document.getElementById('modal-cancel').onclick = function () { App.closeModal(); };
    wrap.addEventListener('click', function (e) { if (e.target === wrap) App.closeModal(); });
    document.getElementById('modal-save').onclick = function () {
      if (onSubmit) onSubmit();
    };
  },
  closeModal: function () {
    var el = document.getElementById('modal-backdrop');
    if (el) el.remove();
  },
  formValues: function (fieldKeys) {
    var out = {};
    fieldKeys.forEach(function (k) {
      var el = document.getElementById('f_' + k);
      if (!el) return;
      if (el.type === 'checkbox') out[k] = el.checked;
      else out[k] = el.value;
    });
    return out;
  },

  field: function (key, label, type, options, value, full) {
    var id = 'f_' + key;
    var v = (value === undefined || value === null) ? '' : value;
    var input;
    if (type === 'select') {
      input = '<select id="' + id + '">' + '<option value=""></option>' + options.map(function (o) {
        var ov = (typeof o === 'object') ? o.value : o;
        var ol = (typeof o === 'object') ? o.label : o;
        return '<option value="' + App.esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + App.esc(ol) + '</option>';
      }).join('') + '</select>';
    } else if (type === 'textarea') {
      input = '<textarea id="' + id + '" rows="2">' + App.esc(v) + '</textarea>';
    } else if (type === 'checkbox') {
      input = '<input type="checkbox" id="' + id + '" ' + (v === true || v === 'TRUE' ? 'checked' : '') + ' style="width:auto">';
    } else if (type === 'date') {
      input = '<input type="date" id="' + id + '" value="' + App.esc(App.fmtDate(v)) + '">';
    } else if (type === 'number') {
      input = '<input type="number" id="' + id + '" value="' + App.esc(v) + '">';
    } else {
      input = '<input type="text" id="' + id + '" value="' + App.esc(v) + '">';
    }
    return '<div class="form-field' + (full ? ' full' : '') + '"><label>' + label + '</label>' + input + '</div>';
  },

  toast: function (msg, isError) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:' + (isError ? '#b3261e' : '#1a7f4e') + ';color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  },

  Views: {} // populated by JS_Views.html
};
</script>
