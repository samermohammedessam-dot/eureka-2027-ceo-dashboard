<script>
/** CRUD modal forms. Each opens a modal built from a field-definition list, then posts to the matching api_save* function. */
App.Forms = {};

function buildForm(fields, record) {
  record = record || {};
  return '<div class="form-grid">' + fields.map(function (f) {
    return App.field(f.key, f.label, f.type, f.options, record[f.key], f.full);
  }).join('') + '</div>';
}

function collect(fields) {
  var out = {};
  fields.forEach(function (f) {
    var el = document.getElementById('f_' + f.key);
    if (!el) return;
    if (f.type === 'checkbox') out[f.key] = el.checked;
    else if (f.type === 'percentInput') out[f.key] = (Number(el.value) || 0) / 100;
    else if (f.type === 'number') out[f.key] = Number(el.value) || 0;
    else out[f.key] = el.value;
  });
  return out;
}

function lk(key) { return (App.state.lookups && App.state.lookups[key]) || []; }

// ---- Tasks ----
App.Forms.openTaskForm = function (record, defaultWeekId) {
  var fields = [
    { key: 'weekId', label: 'Week', type: 'select', options: lk('weeks').map(function (w) { return { value: w.weekId, label: w.label }; }) },
    { key: 'task', label: 'Task', full: true },
    { key: 'taskCategory', label: 'Category', type: 'select', options: lk('taskCategories') },
    { key: 'taskDescription', label: 'Description', type: 'textarea', full: true },
    { key: 'expectedDeliverable', label: 'Expected Deliverable', full: true },
    { key: 'taskOwner', label: 'Owner', type: 'select', options: lk('team') },
    { key: 'supportingTeam', label: 'Supporting Team' },
    { key: 'priority', label: 'Priority', type: 'select', options: lk('taskPriority') },
    { key: 'status', label: 'Status', type: 'select', options: lk('taskStatus') },
    { key: 'startDate', label: 'Start Date', type: 'date' },
    { key: 'dueDate', label: 'Due Date', type: 'date' },
    { key: 'completionDate', label: 'Completion Date', type: 'date' },
    { key: 'percentCompletion', label: '% Completion (0-100)', type: 'percentInput' },
    { key: 'dependency', label: 'Dependency' },
    { key: 'blocker', label: 'Blocker' },
    { key: 'ceoAttentionRequired', label: 'CEO Attention Required?', type: 'checkbox' },
    { key: 'notes', label: 'Notes', type: 'textarea', full: true }
  ];
  var rec = record || { weekId: defaultWeekId };
  App.openModal(record ? 'Edit Task' : 'Add Task', buildForm(fields, rec), function () {
    var data = collect(fields);
    if (record) data.taskId = record.taskId;
    App.call('api_saveTask', data).then(function (res) {
      App.closeModal();
      if (res.ok) { App.toast('Task saved.'); App.navigate(App.state.currentView); } else App.toast(res.error, true);
    });
  });
};

App.Forms.openGenericForm = function (sheetName, idKey, record, label, onSaved) {
  var fields = buildGenericFieldDefs()[sheetName];
  if (!fields) { App.toast('No form defined for ' + sheetName, true); return; }
  App.openModal((record ? 'Edit ' : 'Add ') + label, buildForm(fields, record), function () {
    var data = collect(fields);
    if (record) data[idKey] = record[idKey];
    App.call('api_saveGenericRecord', sheetName, data).then(function (res) {
      App.closeModal();
      if (res.ok) { App.toast(label + ' saved.'); if (onSaved) onSaved(); else App.navigate(App.state.currentView); }
      else App.toast(res.error, true);
    });
  });
};
